<title>The UCLA Six</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ── tokens ─────────────────────────────────────────────────────────────
   Light is the complete set on bare :root. Dark redefines ONLY tokens,
   once under prefers-color-scheme (guarded so an explicit light stamp
   wins) and once under the data-theme stamp (so the toggle wins too). */
:root {
  color-scheme: light;
  --paper:      #f2f5f8;
  --card:       #ffffff;
  --card-sunk:  #eaeff5;
  --ink:        #0e1116;
  --ink-mid:    #3d4652;
  --ink-soft:   #5f6b7a;
  --ink-faint:  #8c97a5;
  --rule:       #dbe2ea;
  --rule-firm:  #c3ccd8;
  --accent:     #2a78d6;
  --accent-sunk:#e2ecfa;
  --counter:    #eb6834;
  --pool:       #b6c0cd;
  --holds:      #1baf7a;
  --moves:      #c07c00;
  --unres:      #8c97a5;
  --shade:      #eef2f7;

  --w-text: 63ch;
  --w-wide: 1080px;
  --s1: .35rem; --s2: .7rem; --s3: 1.1rem; --s4: 1.8rem;
  --s5: 2.8rem; --s6: 4.2rem; --s7: 6rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:      #12151a;
    --card:       #191d24;
    --card-sunk:  #1f242c;
    --ink:        #eef2f7;
    --ink-mid:    #b9c3cf;
    --ink-soft:   #97a2b0;
    --ink-faint:  #6c7684;
    --rule:       #262c35;
    --rule-firm:  #38404b;
    --accent:     #3987e5;
    --accent-sunk:#17273c;
    --counter:    #d95926;
    --pool:       #4a535f;
    --holds:      #199e70;
    --moves:      #c98500;
    --unres:      #6c7684;
    --shade:      #1c2129;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:      #12151a;
  --card:       #191d24;
  --card-sunk:  #1f242c;
  --ink:        #eef2f7;
  --ink-mid:    #b9c3cf;
  --ink-soft:   #97a2b0;
  --ink-faint:  #6c7684;
  --rule:       #262c35;
  --rule-firm:  #38404b;
  --accent:     #3987e5;
  --accent-sunk:#17273c;
  --counter:    #d95926;
  --pool:       #4a535f;
  --holds:      #199e70;
  --moves:      #c98500;
  --unres:      #6c7684;
  --shade:      #1c2129;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1.0625rem/1.68 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--w-wide); margin: 0 auto; padding: 0 var(--s4); }
.col  { max-width: var(--w-text); margin-inline: auto; }

h1, h2, h3 { font-family: Newsreader, ui-serif, Georgia, serif; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.9rem, 7vw, 5.1rem); font-weight: 700; line-height: 1.02; letter-spacing: -.022em; }
h2 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); font-weight: 600; line-height: 1.14; letter-spacing: -.014em; }
h3 { font-size: 1.28rem; font-weight: 600; line-height: 1.25; }
p  { margin: 0 0 var(--s3); }
a  { color: var(--accent); text-underline-offset: .18em; }
strong { font-weight: 600; color: var(--ink); }
em { font-style: italic; }

.eyebrow {
  font: 500 .72rem/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
}
.num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

/* ── hero ───────────────────────────────────────────────────────────── */
.hero { padding: clamp(4rem, 11vh, 8rem) 0 var(--s6); }
.hero .rule-top { height: 3px; background: var(--ink); margin-bottom: var(--s4); }
.hero h1 { margin-bottom: var(--s4); }
.hero .stand {
  font-family: Newsreader, ui-serif, Georgia, serif;
  font-size: clamp(1.2rem, 2.1vw, 1.5rem); line-height: 1.5; color: var(--ink-mid);
  max-width: 54ch; margin-bottom: var(--s4);
}
.byline {
  display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3);
  font: 400 .82rem/1.5 "IBM Plex Mono", ui-monospace, monospace;
  color: var(--ink-faint); border-top: 1px solid var(--rule); padding-top: var(--s3);
}

/* ── sections ───────────────────────────────────────────────────────── */
section { padding-block: var(--s6); border-top: 1px solid var(--rule); }
.sec-head { margin-bottom: var(--s4); }
.sec-head .eyebrow { display: block; margin-bottom: var(--s2); }

/* ── stability chip: encodes the repo's own vintage verdict ─────────── */
.chip {
  display: inline-flex; align-items: center; gap: .45em;
  font: 500 .68rem/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-mid); background: var(--card);
  border: 1px solid var(--rule-firm); border-radius: 2px;
  padding: .4em .6em; white-space: nowrap;
}
.chip::before {
  content: ""; width: .5em; height: .5em; border-radius: 50%;
  background: var(--dot, var(--unres)); flex: none;
}
.chip.holds { --dot: var(--holds); }
.chip.moves { --dot: var(--moves); }
.chip.unres { --dot: var(--unres); }
.chiprow { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s3); }

/* ── figures ────────────────────────────────────────────────────────── */
figure { margin: var(--s5) 0; }
.fig-head { max-width: var(--w-text); margin: 0 auto var(--s3); }
.fig-head h3 { margin-bottom: var(--s1); }
.fig-head p { color: var(--ink-soft); font-size: .94rem; margin: 0; }
figcaption {
  max-width: var(--w-text); margin: var(--s3) auto 0;
  font-size: .86rem; line-height: 1.6; color: var(--ink-soft);
}
.plot { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: var(--s3); }
.scroller { overflow-x: auto; }
svg { display: block; max-width: 100%; height: auto; }
.gridline { stroke: var(--rule); stroke-width: 1; }
.axis { stroke: var(--rule-firm); stroke-width: 1; }
.tick { font: 400 11px "IBM Plex Mono", ui-monospace, monospace; fill: var(--ink-faint); }
.slab { font: 500 12px "IBM Plex Sans", sans-serif; fill: var(--ink-mid); }
.zero { stroke: var(--ink-faint); stroke-width: 1.5; }

.legend { display: flex; flex-wrap: wrap; gap: var(--s3); margin-bottom: var(--s3);
          font-size: .82rem; color: var(--ink-mid); }
.legend span { display: inline-flex; align-items: center; gap: .45em; }
.swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; }

/* ── small multiples ────────────────────────────────────────────────── */
.sm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
           background: var(--rule); border: 1px solid var(--rule); border-radius: 3px; }
.sm { background: var(--card); padding: var(--s3); }
.sm h4 { margin: 0 0 .15rem; font: 600 .95rem/1.2 "IBM Plex Sans", sans-serif; }
.sm .meta { font: 400 .74rem/1.3 "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-faint);
            margin-bottom: var(--s2); }

/* ── table ──────────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: .55rem .7rem; text-align: right; border-bottom: 1px solid var(--rule); }
th:first-child, td:first-child { text-align: left; }
thead th { font: 500 .7rem/1.3 "IBM Plex Mono", ui-monospace, monospace;
           letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint);
           border-bottom: 1px solid var(--rule-firm); }
tbody td { font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--card-sunk); }
td.name { font-weight: 500; }

details.tbl { margin-top: var(--s3); max-width: var(--w-text); margin-inline: auto; }
details.tbl summary {
  cursor: pointer; font: 500 .78rem/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft);
  padding: .5rem 0; list-style: none;
}
details.tbl summary::-webkit-details-marker { display: none; }
details.tbl summary::before { content: "▸ "; }
details.tbl[open] summary::before { content: "▾ "; }
details.tbl summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── callout ────────────────────────────────────────────────────────── */
.note {
  background: var(--card); border: 1px solid var(--rule);
  border-left: 3px solid var(--accent); border-radius: 2px;
  padding: var(--s3) var(--s4); margin: var(--s4) auto; max-width: var(--w-text);
}
.note .eyebrow { display: block; margin-bottom: var(--s2); }
.note p:last-child { margin-bottom: 0; }

/* ── player cards ───────────────────────────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: var(--s3); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 3px;
        padding: var(--s3) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.card h3 { font-family: Newsreader, serif; }
.card .team { font: 500 .72rem/1 "IBM Plex Mono", monospace; letter-spacing: .1em;
              color: var(--ink-faint); }
.card .line { font: 400 .8rem/1.5 "IBM Plex Mono", monospace; color: var(--ink-soft); }
.card p { font-size: .93rem; line-height: 1.6; margin: 0; color: var(--ink-mid); }
.bars { display: flex; flex-direction: column; gap: .3rem; margin-top: var(--s1); }
.bar { display: grid; grid-template-columns: 6.2rem 1fr 2.4rem; align-items: center; gap: .5rem;
       font: 400 .74rem/1 "IBM Plex Mono", monospace; color: var(--ink-soft); }
.bar .track { height: 7px; background: var(--card-sunk); border-radius: 2px; position: relative; }
.bar .fill { position: absolute; inset-block: 0; left: 0; background: var(--accent);
             border-radius: 2px; }
.bar .v { text-align: right; color: var(--ink-mid); font-variant-numeric: tabular-nums; }

/* ── footer ─────────────────────────────────────────────────────────── */
footer { padding-block: var(--s6) var(--s7); border-top: 1px solid var(--rule); }
footer p { font-size: .88rem; color: var(--ink-soft); }

.tip {
  position: fixed; pointer-events: none; z-index: 40; opacity: 0;
  transition: opacity .1s; background: var(--ink); color: var(--paper);
  font: 400 .78rem/1.45 "IBM Plex Mono", ui-monospace, monospace;
  padding: .45rem .6rem; border-radius: 3px; max-width: 15rem;
}
.tip strong { color: var(--paper); font-weight: 600; }
.tip.on { opacity: 1; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 900px) { .sm-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .sm-grid { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .wrap { padding: 0 1.1rem; }
  .bar { grid-template-columns: 5rem 1fr 2.2rem; }
}
</style>
