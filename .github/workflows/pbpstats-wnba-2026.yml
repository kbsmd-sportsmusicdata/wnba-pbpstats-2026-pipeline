name: PBPStats WNBA 2026 Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * 5-10 *"

jobs:
  pbpstats-wnba-2026:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PBPSTATS_PIPELINE_DATA_ROOT: data/pbpstats_wnba_2026
      PBPSTATS_GAME_LOGS_DATA_ROOT: data/pbpstats_2026_player_game_logs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull and clean current PBPStats data
        run: python scripts/pbpstats_2026_pull_clean.py

      - name: Build current-season features and leaderboards
        run: python scripts/pbpstats_2026_features.py

      - name: Ingest player and team game logs (historical + incremental)
        run: python scripts/fetch_wnba_pbpstats_game_logs_2026.py

      - name: Commit generated outputs if changed
        run: |
          find data/pbpstats_wnba_2026 data/pbpstats_2026_player_game_logs -type f \( -name '*.csv' -o -name '*.json' \) -print0 | xargs -0 git add
          if git diff --cached --quiet; then
            echo "No generated file changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh WNBA 2026 PBPStats outputs"
          git push
