name: PBPStats WNBA 2026 Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * 5-10 *"

jobs:
  pbpstats-wnba-2026:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PBPSTATS_PIPELINE_DATA_ROOT: data/pbpstats_wnba_2026
      PBPSTATS_GAME_LOGS_DATA_ROOT: data/pbpstats_2026_player_game_logs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull and clean current PBPStats data
        run: python scripts/pbpstats_2026_pull_clean.py

      - name: Build current-season features and leaderboards
        run: python scripts/pbpstats_2026_features.py

      - name: Ingest player and team game logs (historical + incremental)
        run: python scripts/fetch_wnba_pbpstats_game_logs_2026.py

      - name: Build shared normalized game layer
        run: python scripts/build_wnba_game_layer_2026.py

      - name: Commit generated outputs if changed
        run: |
          find data/pbpstats_wnba_2026 data/pbpstats_2026_player_game_logs -type f \( -name '*.csv' -o -name '*.json' \) -print0 | xargs -0 git add
          git add -A data/processed/wnba_pbpstats_player_game data/processed/wnba_pbpstats_team_game
          if git diff --cached --quiet; then
            echo "No generated file changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh WNBA 2026 PBPStats outputs"
          # main can move while this run is in flight (a merge, another scheduled run). Rebase our
          # single data-refresh commit onto the latest main before pushing, retrying a few times.
          # On the rare conflict over the same regenerated files, our freshly built version wins
          # (-X theirs favors the commit being replayed during a rebase).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto latest ${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "failed to push after retries" >&2
          exit 1
