name: Injury Report

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run injury report tests before building"
        required: true
        type: boolean
        default: true
      commit_outputs:
        description: "Commit generated analysis/injuries outputs"
        required: true
        type: boolean
        default: false
      injuries_path:
        description: "Raw ESPN injury feed (parquet)"
        required: true
        type: string
        default: "data/raw/injuries/injuries_2026.parquet"

jobs:
  injuries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CONFIG_PATH: analysis/injuries/config/injuries_config.json
      INJURIES_PATH: ${{ inputs.injuries_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Injury Report tests
        if: ${{ inputs.run_tests }}
        run: python -m unittest tests/test_injuries.py

      - name: Build injury report
        run: |
          python scripts/build_injury_report.py \
            --config "$CONFIG_PATH" \
            --injuries-path "$INJURIES_PATH"

      - name: Build forecast availability context
        run: |
          python scripts/build_forecast_availability_context.py \
            --config analysis/injuries/config/forecast_availability_config.json \
            --injuries-path "$INJURIES_PATH"

      - name: Commit generated injury report outputs if requested
        if: ${{ inputs.commit_outputs }}
        run: |
          git add analysis/injuries
          if git diff --cached --quiet; then
            echo "No Injury Report output changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh injury report"
          # main can move while this run is in flight; rebase before pushing, retrying with backoff.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "failed to push after retries" >&2
          exit 1
