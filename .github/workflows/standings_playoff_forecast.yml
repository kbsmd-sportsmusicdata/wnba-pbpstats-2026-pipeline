name: WNBA Standings and Playoff Forecast

"on":
  workflow_dispatch:
    inputs:
      season:
        description: "WNBA season"
        required: true
        type: string
        default: "2026"
      cutoff:
        description: "Optional YYYY-MM-DD cutoff"
        required: false
        type: string
        default: ""
      simulations:
        description: "Monte Carlo runs"
        required: true
        type: string
        default: "100000"
      source_feed:
        description: "Completed-game source. pbpstats (default) is fresh and works on GitHub runners; sportsdataverse is the republished fallback and lags; espn is fresh but ESPN IP-blocks GitHub Actions, so it only works on a self-hosted or local run."
        required: true
        type: choice
        options:
          - pbpstats
          - sportsdataverse
          - espn
        default: pbpstats
      refresh_sportsdataverse:
        description: "Refresh 2026 SportsDataverse sources"
        required: true
        type: boolean
        default: true
      refresh_pbpstats:
        description: "Refresh 2026 PBPStats sources"
        required: true
        type: boolean
        default: false
      run_tests:
        description: "Run standings forecast tests before building"
        required: true
        type: boolean
        default: true
      commit_outputs:
        description: "Commit only generated forecast outputs"
        required: true
        type: boolean
        default: false

concurrency:
  group: standings-playoff-forecast-${{ inputs.season }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standings-playoff-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORECAST_SEASON: ${{ inputs.season }}
      FORECAST_CUTOFF: ${{ inputs.cutoff }}
      FORECAST_SIMULATIONS: ${{ inputs.simulations }}
      SOURCE_FEED: ${{ inputs.source_feed }}
      ESPN_DATA_ROOT: data/raw/espn/wnba_2026
      PBPSTATS_FORECAST_DATA_ROOT: data/raw/pbpstats_forecast/wnba_2026
      REFRESH_SPORTSDATAVERSE: ${{ inputs.refresh_sportsdataverse }}
      REFRESH_PBPSTATS: ${{ inputs.refresh_pbpstats }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs
        run: |
          set -euo pipefail

          if [[ ! "$FORECAST_SEASON" =~ ^[0-9]{4}$ ]]; then
            echo "season must be exactly four digits" >&2
            exit 2
          fi
          if [[ ! "$FORECAST_SIMULATIONS" =~ ^[0-9]+$ ]] || [[ "$FORECAST_SIMULATIONS" =~ ^0+$ ]]; then
            echo "simulations must be a positive integer" >&2
            exit 2
          fi
          if [[ -n "$FORECAST_CUTOFF" ]]; then
            if [[ ! "$FORECAST_CUTOFF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "cutoff must use strict YYYY-MM-DD format" >&2
              exit 2
            fi
            python - "$FORECAST_CUTOFF" <<'PY'
          import datetime as dt
          import sys

          try:
              parsed = dt.date.fromisoformat(sys.argv[1])
          except ValueError as error:
              raise SystemExit(f"cutoff must be a real calendar date: {error}")
          if parsed.isoformat() != sys.argv[1]:
              raise SystemExit("cutoff must use strict YYYY-MM-DD format")
          PY
          fi
          if [[ "$FORECAST_SEASON" != "2026" ]] && \
             [[ "$REFRESH_SPORTSDATAVERSE" == "true" || "$REFRESH_PBPSTATS" == "true" ]]; then
            echo "source refresh is supported only for season 2026" >&2
            exit 2
          fi

      - name: Refresh SportsDataverse
        if: ${{ inputs.refresh_sportsdataverse && inputs.season == '2026' }}
        run: python scripts/fetch_wnba_sportsdataverse_2026.py

      - name: Fetch pbpstats fresh completed games
        if: ${{ inputs.source_feed == 'pbpstats' && inputs.season == '2026' }}
        run: |
          python scripts/fetch_wnba_pbpstats_forecast_2026.py \
            --season 2026 \
            --data-root "$PBPSTATS_FORECAST_DATA_ROOT" \
            --expected-games-per-team 44

      - name: Fetch ESPN live source
        if: ${{ inputs.source_feed == 'espn' && inputs.season == '2026' }}
        run: |
          python scripts/fetch_wnba_espn_2026.py \
            --season 2026 \
            --data-root "$ESPN_DATA_ROOT" \
            --expected-games-per-team 44

      - name: Refresh PBPStats
        if: ${{ inputs.refresh_pbpstats && inputs.season == '2026' }}
        run: |
          python scripts/pbpstats_2026_pull_clean.py
          python scripts/pbpstats_2026_features.py

      - name: Run forecast tests
        if: ${{ inputs.run_tests }}
        run: python -m unittest discover -s tests -p "test_standings_playoff_forecast*.py"

      - name: Build forecast and deliverables
        run: |
          set -euo pipefail
          ARGS=(
            --season "$FORECAST_SEASON"
            --simulations "$FORECAST_SIMULATIONS"
            --render all
            --team-game-output-path-file .git/standings_forecast_team_game_output_path
          )
          # The fresh feeds land in their own data roots; point the forecast at the chosen
          # one so its cutoff tracks completed games instead of the lagging SportsDataverse
          # republish. sportsdataverse reads the default root and needs no override.
          if [[ "$SOURCE_FEED" == "pbpstats" && "$FORECAST_SEASON" == "2026" ]]; then
            ARGS+=(--sportsdataverse-data-root "$PBPSTATS_FORECAST_DATA_ROOT")
          elif [[ "$SOURCE_FEED" == "espn" && "$FORECAST_SEASON" == "2026" ]]; then
            ARGS+=(--sportsdataverse-data-root "$ESPN_DATA_ROOT")
          fi
          if [[ -n "$FORECAST_CUTOFF" ]]; then
            ARGS+=(--cutoff "$FORECAST_CUTOFF")
          fi
          python scripts/build_standings_playoff_forecast.py "${ARGS[@]}"

      - name: Validate forecast artifacts
        run: |
          set -euo pipefail
          DELIVERABLE_ROOT="analysis/standings_playoff_forecast/deliverables/season=$FORECAST_SEASON/latest"
          PROCESSED_ROOT="analysis/standings_playoff_forecast/data/processed/season=$FORECAST_SEASON/latest"
          REQUIRED_FILES=(
            "$DELIVERABLE_ROOT/wnba_standings_playoff_forecast.xlsx"
            "$DELIVERABLE_ROOT/wnba_broadcast_forecast_brief.md"
            "$DELIVERABLE_ROOT/wnba_playoff_stat_pack_insert.html"
            "$DELIVERABLE_ROOT/dashboard/index.html"
            "$DELIVERABLE_ROOT/dashboard/assets/styles.css"
            "$DELIVERABLE_ROOT/dashboard/assets/app.js"
            "$DELIVERABLE_ROOT/dashboard/assets/charts.js"
            "$DELIVERABLE_ROOT/dashboard/data/forecast_payload.json"
            "$PROCESSED_ROOT/run_manifest.json"
          )
          for artifact in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$artifact" ]]; then
              echo "required forecast artifact is missing or empty: $artifact" >&2
              exit 1
            fi
          done
          python - "$PROCESSED_ROOT/run_manifest.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest_path = Path(sys.argv[1])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_source = {
              "current_standings": "derived_from_schedule_and_team_box",
              "schedule": "mandatory",
              "team_box": "mandatory",
              "external_standings": "optional_validation",
          }
          if manifest.get("source_of_truth") != expected_source:
              raise SystemExit("run manifest does not identify the canonical derived-standings source")
          source_files = manifest.get("source_files")
          if not isinstance(source_files, list) or not source_files:
              raise SystemExit("run manifest source_files must be a nonempty list")
          sources_by_name = {}
          for source in source_files:
              if not isinstance(source, dict):
                  raise SystemExit("run manifest source_files entries must be mappings")
              name = source.get("name")
              if not isinstance(name, str) or not name.strip():
                  raise SystemExit("run manifest source provenance has an invalid name")
              if name in sources_by_name:
                  raise SystemExit(f"run manifest has duplicate source provenance: {name}")
              path = source.get("path")
              if (
                  not isinstance(path, str)
                  or not path.strip()
                  or not Path(path).is_absolute()
              ):
                  raise SystemExit(f"run manifest source {name} has an invalid path")
              size_bytes = source.get("size_bytes")
              if (
                  isinstance(size_bytes, bool)
                  or not isinstance(size_bytes, int)
                  or size_bytes < 0
              ):
                  raise SystemExit(f"run manifest source {name} has invalid size_bytes")
              sha256 = source.get("sha256")
              if (
                  not isinstance(sha256, str)
                  or len(sha256) != 64
                  or any(character not in "0123456789abcdef" for character in sha256.lower())
              ):
                  raise SystemExit(f"run manifest source {name} has an invalid SHA-256")
              sources_by_name[name] = source
          missing_mandatory_sources = {"schedule", "team_box"}.difference(sources_by_name)
          if missing_mandatory_sources:
              missing = ", ".join(sorted(missing_mandatory_sources))
              raise SystemExit(f"run manifest is missing mandatory source provenance: {missing}")
          if manifest.get("ledger_validation") != {"status": "validated"}:
              raise SystemExit("canonical completed-game ledger is not validated")
          schedule_validation = manifest.get("season_schedule_validation")
          if (
              not isinstance(schedule_validation, dict)
              or schedule_validation.get("status") != "validated"
          ):
              raise SystemExit("season schedule counts are not validated")
          external_qa = manifest.get("external_standings_qa")
          if not isinstance(external_qa, dict):
              raise SystemExit("run manifest is missing external standings QA evidence")
          external_status = external_qa.get("status")
          allowed_external_statuses = {
              "unavailable",
              "unparseable",
              "matched",
              "mismatch",
          }
          if external_status not in allowed_external_statuses:
              raise SystemExit(f"invalid external standings QA status: {external_status!r}")
          print(f"external standings QA: {external_status} (non-blocking)")
          PY

      - name: Upload forecast artifact
        uses: actions/upload-artifact@v7
        with:
          name: wnba-standings-forecast-${{ inputs.season }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            analysis/standings_playoff_forecast/deliverables/season=${{ inputs.season }}/latest/**
            analysis/standings_playoff_forecast/data/processed/season=${{ inputs.season }}/latest/run_manifest.json

      - name: Commit forecast outputs if requested
        if: ${{ inputs.commit_outputs }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "branch" || -z "${GITHUB_REF_NAME:-}" ]]; then
            echo "commit_outputs requires a branch ref" >&2
            exit 2
          fi
          TEAM_GAME_OUTPUT="$(python - "$FORECAST_SEASON" "$FORECAST_CUTOFF" <<'PY'
          import os
          from pathlib import Path
          import sys

          season, cutoff = sys.argv[1:]
          workspace = Path.cwd().resolve()
          evidence_path = workspace / ".git/standings_forecast_team_game_output_path"
          try:
              lines = evidence_path.read_text(encoding="utf-8").splitlines()
          except OSError as error:
              raise SystemExit(f"team-game output path evidence is unavailable: {error}")
          if len(lines) != 1 or not lines[0].strip():
              raise SystemExit("team-game output path evidence must contain exactly one path")
          raw_path = Path(lines[0])
          if not raw_path.is_absolute():
              raise SystemExit("team-game output path evidence must be absolute")
          candidate = Path(os.path.abspath(raw_path))
          season_root = (
              workspace / f"data/processed/wnba_team_game/season={season}"
          )
          allowed = {season_root / "team_game.parquet"}
          if cutoff:
              allowed.add(season_root / f"cutoff={cutoff}" / "team_game.parquet")
          if candidate not in allowed:
              raise SystemExit(
                  "team-game output path evidence is outside the exact forecast allowlist"
              )
          if candidate.is_symlink() or not candidate.is_file():
              raise SystemExit(
                  f"team-game output is missing or is not a regular file: {candidate}"
              )
          print(candidate.relative_to(workspace).as_posix())
          PY
          )"
          git add -- \
            "analysis/standings_playoff_forecast/data/processed/season=$FORECAST_SEASON/latest" \
            "analysis/standings_playoff_forecast/deliverables/season=$FORECAST_SEASON/latest" \
            "$TEAM_GAME_OUTPUT"
          if git diff --cached --quiet; then
            echo "No standings forecast output changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh WNBA $FORECAST_SEASON standings forecast"
          git push origin "HEAD:$GITHUB_REF_NAME"
